<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
  </head>
  <body>
    <h1>Estudos DOM</h1>
    <p>Aprendendo a usar o DOM em JavaScript</p>
    <p>Aqui que vai mudar</p>
    <p class="msg">Usando outro seletor</p>

    <script>
      let paragrafo = document.getElementsByTagName("p")[1];

      paragrafo.innerText = "Texto alterado pelo JavaScript";
      paragrafo.style.color = "red";

      let paragrafo2 = document.getElementsByClassName("msg")[0];

      paragrafo2.innerHTML =
        "Mudamos o texto usando o seletor <strong>class</strong>";
    </script>
  </body>
</html>
